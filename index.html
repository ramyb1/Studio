<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0f11">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2322252a'/><path d='M9 12h14M16 12v10' stroke='%238a5a39' stroke-width='2.2' stroke-linecap='round'/><circle cx='9' cy='12' r='3.2' fill='%23e0915a'/><circle cx='23' cy='12' r='3.2' fill='%23e0915a'/><circle cx='16' cy='22.5' r='3.4' fill='%23ecebe7'/></svg>">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: vaste zijbalk met navigatie, werkvlak rechts; op mobiel navigatie bovenaan. */
@font-face{font-family:"Sora";font-weight:400;font-display:swap;src:url(fonts/sora-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Sora";font-weight:600;font-display:swap;src:url(fonts/sora-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Sora";font-weight:700;font-display:swap;src:url(fonts/sora-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:500;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}
:root{
  /* Huisstijl: antraciet met koper. Donker als basis, koper voor wat je moet doen. */
  --bg:#131417; --side:#0e0f11; --panel:#1b1d21; --panel-2:#212429; --line:#2b2f35; --line-2:#3a3f47;
  --text:#ecebe7; --muted:#a4a39e; --faint:#7a7a7d;
  --accent:#e0915a; --accent-2:#2b2119; --accent-ink:#1a110a; --accent-text:#1a110a; --copper-soft:#b9784b;
  --ok:#62c391; --ok-bg:#15281e; --pos:#62c391; --pos-bg:#15281e;
  --bad:#f0806f; --bad-bg:#34201d; --neg:#f0806f; --neg-bg:#34201d;
  --warn:#e7b552; --warn-bg:#2f2719; --info:#93b5e6; --info-bg:#1a2433;
  --shadow:0 1px 0 rgba(255,255,255,.025) inset,0 8px 24px rgba(0,0,0,.28);
  --radius:12px;
  --display:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{padding:2px 10px 18px}
.brand b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted);border:0;background:none;text-align:left;width:100%;text-decoration:none}
.nav:hover{background:var(--panel-2);color:var(--text)}
.nav.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.nav .cnt{font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;line-height:17px;font-weight:600}
.side .spacer{flex:1}
.navsep{height:1px;background:var(--line);margin:8px 10px}
.store{font-size:12px;border-radius:8px;padding:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.store b{display:flex;align-items:center;gap:6px;color:var(--text);font-weight:600;margin-bottom:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.store.ok .dot{background:var(--ok)} .store.warn .dot{background:var(--warn)} .store.bad .dot{background:var(--bad)}
main{padding:26px 32px 64px;max-width:1180px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.02em;font-weight:650;text-wrap:balance}
h2{font-size:14.5px;margin:0;font-weight:620}
h3{font-size:12px;margin:0 0 8px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sub{color:var(--muted);margin-top:4px;max-width:68ch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}}
.stat .l{color:var(--muted);font-size:12px}
.stat .v{font-size:20px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{color:var(--faint);font-size:12px}
.btn{border:1px solid var(--line-2);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;line-height:1.2;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel-2)}
.btn.danger{color:var(--bad)}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:550;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--panel-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .neg{color:var(--bad)}
.mono{font-family:var(--mono);font-size:12.5px}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-2);color:var(--accent);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--panel);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar select{width:auto}
.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.quiet{color:var(--muted);font-size:13px;padding:6px 0}
.banner{border-radius:var(--radius);padding:10px 14px;background:var(--accent-2);color:var(--accent);font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
/* werkregels */
.items{list-style:none;margin:0;padding:0}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 0 10px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent;margin-left:-12px}
.item:last-child{border-bottom:0}
.item.sev-bad{border-left-color:var(--bad)} .item.sev-warn{border-left-color:var(--warn)} .item.sev-acc{border-left-color:var(--accent)}
.item .main{flex:1;min-width:0}
.item .ctx{font-size:12px;color:var(--muted)}
.item .t{font-weight:600}
.item .r{font-size:12.5px;color:var(--muted)}
.item .side-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.when{font-size:12px;color:var(--muted);white-space:nowrap}
.when.late{color:var(--bad);font-weight:600}
.chk{appearance:none;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:5px;margin:2px 0 0;cursor:pointer;flex:none;background:var(--panel);display:grid;place-content:center}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
/* fase-balk */
.phases{display:flex;gap:3px;margin-top:6px}
.phases i{display:block;height:4px;flex:1;border-radius:2px;background:var(--line)}
.phases i.on{background:var(--accent)}
.stagebar{height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.stagebar span{display:block;height:100%;background:var(--accent)}
/* checklist */
.check-list{list-style:none;margin:0;padding:0}
.check-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.check-list li:last-child{border-bottom:0}
.check-list .mark{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;display:grid;place-content:center;font-size:11px;color:#fff}
.check-list li.done .mark{background:var(--ok);border-color:var(--ok)}
.check-list li.done span.t{color:var(--faint);text-decoration:line-through}
/* formulieren */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label.f>span{font-weight:550}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=url],input[type=tel],select,textarea{border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;background:var(--panel);color:var(--text);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:0;border-color:var(--accent)}
textarea{min-height:68px;resize:vertical}
.fg{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.fg .full{grid-column:1/-1}
@media (max-width:620px){.fg{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--faint)}
.dropzone{border:2px dashed var(--line-2);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;display:block}
.dropzone:hover,.dropzone.over{border-color:var(--accent);color:var(--accent)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px}
.kv>div:nth-child(odd){color:var(--muted)}
.big{font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(640px,100%);border:1px solid var(--line)}
.modal.wide{width:min(900px,100%)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:16px}
.modal .mb{padding:18px 20px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:13px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 6px;border-radius:6px}
.section{margin-top:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;z-index:90;box-shadow:var(--shadow)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line)}
  .side .brand,.side .spacer,.side .store,.side .navsep{display:none}
  .nav{width:auto;flex:none}
  main{padding:18px 16px 56px}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- huisstijl: antraciet en koper ---- */
body{background:radial-gradient(900px 360px at 92% -8%,rgba(224,145,90,.09),transparent 65%),var(--bg);background-attachment:fixed}
h1,h2,.brand,.brand b,.big,.stat .v,.kpi .v,.modal .mh h2{font-family:var(--display)}
h1{font-weight:700;letter-spacing:-.025em}
h2{font-weight:600;letter-spacing:-.01em}
h3{color:var(--faint);letter-spacing:.08em}
.side{background:var(--side);border-right:1px solid #1f2125}
.brand{display:flex;flex-direction:column;letter-spacing:-.015em}
.brand.brandmark{display:flex;flex-direction:row;align-items:center;gap:10px;text-align:left}
.brand.brandmark small{display:block}
.brandmark svg{flex:none}
.nav{position:relative;color:var(--muted)}
.nav:hover{background:#17191c;color:var(--text)}
.nav.on{background:linear-gradient(90deg,rgba(224,145,90,.16),rgba(224,145,90,.03));color:var(--accent);font-weight:600}
.nav.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
.nav .cnt{background:var(--accent);color:var(--accent-ink)}
.card,.tablewrap,.modal{border-color:var(--line)}
.stat .v,.kpi .v,.big{font-weight:600;letter-spacing:-.03em}
.btn{background:var(--panel-2);border-color:var(--line-2)}
.btn:hover{border-color:#565c66;background:#262a30}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:none;background:#eaa06c;border-color:#eaa06c}
.btn.ghost{background:transparent;border-color:transparent}
.chip{background:var(--panel)}
.chip.on{background:var(--accent-2);color:var(--accent);border-color:var(--copper-soft)}
.when,.mono,td.num,.num{font-family:var(--mono);font-size:12.5px}
.stat .s .neg,.when.late{font-weight:500}
th{color:var(--faint);text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.ov{background:rgba(5,6,8,.66);backdrop-filter:blur(2px)}
.modal{background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,.55)}
.toast{background:var(--accent);color:var(--accent-ink);font-weight:600}
.phases i.on,.stagebar span{background:var(--accent)}
.banner{background:var(--accent-2);color:#f0b48a}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=url],input[type=tel],input:not([type]),select,textarea{background:#16181b;border-color:var(--line-2)}
.dropzone{border-color:var(--line-2)}
::selection{background:rgba(224,145,90,.35)}
</style>
</head>

  <main id="main"><p class="quiet">Dashboard laden…</p></main>

<script>
'use strict';
/* ========== Hulpfuncties ========== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, '').slice(0, 14);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const dagVerschil = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const DAGEN = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
const MAANDEN = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
const fmtDate = s => { if (!s) return ''; const d = new Date(s + 'T12:00:00'); return DAGEN[d.getDay()] + ' ' + d.getDate() + ' ' + MAANDEN[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
const rel = s => { const n = dagVerschil(today(), s); if (n === 0) return 'vandaag'; if (n === 1) return 'morgen'; if (n === -1) return 'gisteren'; return n > 0 ? 'over ' + n + ' dagen' : (-n) + ' dagen geleden'; };
const r2 = n => Math.round((Number(n) || 0) * 100 + Number.EPSILON * 100) / 100;
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const EUR = new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR' });
const EUR0 = new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const money = n => EUR.format(r2(n));
const money0 = n => EUR0.format(Math.round(n || 0));
const fmtMoment = ms => ms ? new Date(ms).toLocaleString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const clone = o => JSON.parse(JSON.stringify(o));
const byId = (list, id) => list.find(x => x.id === id);
function toast(msg, ms = 2400) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }

/* ========== Begrippen ========== */
const LEAD_FASEN = [['contact', 'Eerste contact'], ['gesprek', 'Gesprek gepland'], ['offerte', 'Offerte verstuurd'], ['gewonnen', 'Gewonnen'], ['verloren', 'Verloren']];
const OPEN_FASEN = ['contact', 'gesprek', 'offerte'];
const PROJECT_FASEN = [['intake', 'Intake'], ['bouw', 'Bouw'], ['test', 'Test'], ['live', 'Live'], ['afgerond', 'Afgerond']];
const AUTO_STATUS = [['idee', 'Idee'], ['bouw', 'In ontwikkeling'], ['live', 'Live'], ['gepauzeerd', 'Gepauzeerd']];
const AUTO_BEHEER = [['', 'Nog niet bepaald'], ['beheer', 'Doorlopend beheer'], ['eenmalig', 'Eenmalig opgeleverd']];
const KLANT_BEHEER = [['', 'Nog geen afspraken'], ['beheer', 'Doorlopend beheer'], ['geen', 'Geen beheer']];
const label = (list, v) => (list.find(x => x[0] === v) || ['', v || '—'])[1];
const STATUS_CLS = { idee: '', bouw: 'acc', live: 'ok', gepauzeerd: 'warn' };
const LEAD_CLS = { contact: '', gesprek: 'acc', offerte: 'warn', gewonnen: 'ok', verloren: '' };

/* ========== Staat ========== */
const KEYS = ['leads', 'klanten', 'projecten', 'automatiseringen', 'taken', 'instellingen'];
function leeg() {
  return { leads: [], klanten: [], projecten: [], automatiseringen: [], taken: [], instellingen: { studio: '', startVerborgen: false } };
}
let S = leeg();
const UI = { salesFilter: 'open', projFilter: 'actief', projKlant: '', autoStatus: '', autoVoor: '' };

/* ========== Opslag: dashboard.json in dezelfde map als de boekhouding, met IndexedDB als cache ========== */
// Dashboard en boekhouding draaien in dezelfde app (zelfde origin). Het dashboard gebruikt
// de opslagmap die je in Boekhouding hebt gekozen en schrijft daar dashboard.json naast administratie.json.
const DATAFILE = 'dashboard.json', EIGEN = 'studio-dashboard', BK = 'zzp-boekhouding';
const _dbs = {};
function dbFor(name) {
  if (_dbs[name]) return _dbs[name];
  const stores = name === BK ? ['kv', 'files'] : ['kv'];   // zelfde opbouw als de boekhoudtool
  return (_dbs[name] = new Promise((res, rej) => {
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => stores.forEach(s => { if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s); });

const Store = {

  async init() {

    if (!this.supported) { this.status = 'unsupported'; return; }
    try { this.dir = await idbGet(BK, 'dir'); } catch (e) { this.dir = null; }
    if (!this.dir) { this.status = 'none'; return; }
    try {
      const p = await this.dir.queryPermission({ mode: 'readwrite' });

    } catch (e) { this.status = 'needs-permission'; }

      else if (!file || (file.updatedAt || 0) < (this.updatedAt || 0)) await this.writeNow();
    } catch (e) { this.status = 'error'; this.error = 'Kon ' + DATAFILE + ' niet lezen: ' + e.message; }
  },
  save() {

      await this.writeNamed(null, DATAFILE, json);
      const snap = 'dashboard-' + today() + '.json';   // één kopie per dag, naast die van de boekhouding
      if ((await idbGet(EIGEN, 'lastSnap')) !== snap) { await this.writeNamed('backups', snap, json); await idbSet(EIGEN, 'lastSnap', snap); }

/* ========== Financiën: rechtstreeks uit de boekhouding in dezelfde app ========== */
// Zelfde rekenregels als het scherm Overzicht van de boekhoudtool:
// openstaand = definitieve, nog niet betaalde facturen (status "verzonden"), bedrag incl. btw;
// te laat = vervaldatum vóór vandaag.
function factuurIncl(f, kor) {
  const vrij = f.btwVerlegd || kor; let excl = 0; const per = {};
  (f.regels || []).forEach(r => { const b = r2(num(r.aantal) * num(r.prijs)); excl += b; const t = vrij ? '0' : String(r.btw ?? '21'); per[t] = (per[t] || 0) + b; });
  let btw = 0; Object.entries(per).forEach(([t, g]) => { btw += r2(r2(g) * Number(t) / 100); });
  return r2(r2(excl) + r2(btw));
}
let FIN = null;
async function laadFin() {
  let st = null;

  // een nieuwere versie in de map (bijv. bijgewerkt op een ander apparaat) gaat voor
  if (Store.status === 'connected' && Store.dir) {
    try {
      const t = await (await (await Store.dir.getFileHandle('administratie.json')).getFile()).text();
      const f = t ? JSON.parse(t) : null;
      if (f && f.app === 'zzp-boekhouding' && (!st || (f.updatedAt || 0) > (st.updatedAt || 0))) st = f;
    } catch (e) { }
  }
  if (!st || st.app !== 'zzp-boekhouding' || !st.updatedAt) { FIN = null; return; }
  const kor = !!(st.settings && st.settings.kor); const fs = st.facturen || []; const B = (st.settings && st.settings.bedrijf) || {};
  FIN = {

    concept: fs.filter(f => f.status === 'concept').length,

}

/* ========== Werklijst voor Vandaag ========== */
function werklijst() {
  const t = today(), week = addDays(t, 7);
  const A = { aandacht: [], vandaag: [], komend: [], opvolgen: [] };
  const push = (lijst, it) => A[lijst].push(it);
  S.taken.filter(x => !x.klaar && x.datum).forEach(x => {
    const k = koppeling(x); const base = { soort: 'taak', id: x.id, ctx: k ? k.ctx : 'Losse taak', titel: x.titel, datum: x.datum, open: 'taak:' + x.id, knop: 'Open de taak' };
    if (x.datum < t) push('aandacht', { ...base, ernst: 'bad', reden: 'Moest ' + rel(x.datum) + ' af zijn.' });
    else if (x.datum === t) push('vandaag', { ...base, reden: 'Gepland voor vandaag.' });
    else if (x.datum <= week) push('komend', { ...base, reden: 'Gepland voor ' + fmtDate(x.datum) + '.' });
  });
  S.projecten.filter(p => p.fase !== 'afgerond').forEach(p => {
    const ctx = [klantNaam(p.klantId), p.naam].filter(Boolean).join(' · '); const open = 'project:' + p.id;
    if (p.deadline && p.deadline < t) push('aandacht', { soort: 'project', ctx, titel: 'Deadline verstreken', datum: p.deadline, ernst: 'bad', reden: 'Deadline was ' + fmtDate(p.deadline) + '.', open, knop: 'Open het project' });
    if (p.blokkade && p.blokkadeDatum && p.blokkadeDatum <= t) push('aandacht', { soort: 'project', ctx, titel: 'Blokkade opvolgen: ' + p.blokkade, datum: p.blokkadeDatum, ernst: 'warn', reden: p.blokkadeDatum === t ? 'Opvolgen staat voor vandaag.' : 'Opvolgen stond voor ' + fmtDate(p.blokkadeDatum) + '.', open, knop: 'Open het project' });
    if (p.actie && p.actieDatum) {
      if (p.actieDatum < t) push('aandacht', { soort: 'project', ctx, titel: p.actie, datum: p.actieDatum, ernst: 'bad', reden: 'Volgende actie moest ' + rel(p.actieDatum) + ' af zijn.', open, knop: 'Open het project' });
      else if (p.actieDatum === t) push('vandaag', { soort: 'project', ctx, titel: p.actie, datum: p.actieDatum, reden: 'Volgende actie voor vandaag.', open, knop: 'Open het project' });
      else if (p.actieDatum <= week) push('komend', { soort: 'project', ctx, titel: p.actie, datum: p.actieDatum, reden: 'Volgende actie.', open, knop: 'Open het project' });
    }
    if (p.mijlpaal && p.mijlpaalDatum && p.mijlpaalDatum >= t && p.mijlpaalDatum <= week) push('komend', { soort: 'project', ctx, titel: p.mijlpaal, datum: p.mijlpaalDatum, ernst: 'acc', reden: 'Mijlpaal ' + rel(p.mijlpaalDatum) + '.', open, knop: 'Open de mijlpaal' });
    if (p.deadline && p.deadline >= t && p.deadline <= week) push('komend', { soort: 'project', ctx, titel: 'Deadline project', datum: p.deadline, ernst: 'warn', reden: 'Deadline ' + rel(p.deadline) + '.', open, knop: 'Open het project' });
  });
  S.leads.filter(l => OPEN_FASEN.includes(l.fase) && l.opvolgdatum).forEach(l => {
    const base = { soort: 'lead', ctx: l.bedrijf + (l.contact ? ' · ' + l.contact : ''), titel: l.actie || 'Opvolgen', datum: l.opvolgdatum, open: 'lead:' + l.id, knop: 'Open de lead' };
    if (l.opvolgdatum < t) push('aandacht', { ...base, ernst: 'warn', reden: 'Opvolging stond voor ' + fmtDate(l.opvolgdatum) + '.' });
    else if (l.opvolgdatum <= week) push('opvolgen', { ...base, reden: l.opvolgdatum === t ? 'Vandaag gepland.' : 'Gepland voor ' + fmtDate(l.opvolgdatum) + '.' });
  });
  const fin = finSamenvatting();
  if (fin && fin.laat) push('aandacht', { soort: 'fin', ctx: 'Boekhouding', titel: fin.laat + (fin.laat === 1 ? ' factuur' : ' facturen') + ' over de vervaldatum', datum: '0000', ernst: 'bad', reden: money(fin.bedragLaat) + ' staat open na de vervaldatum.', open: 'financien', knop: 'Bekijk financiën' });
  const sortD = (a, b) => (a.datum || '').localeCompare(b.datum || '');
  A.aandacht.sort((a, b) => (a.ernst === 'bad' ? 0 : 1) - (b.ernst === 'bad' ? 0 : 1) || sortD(a, b));
  A.vandaag.sort(sortD); A.komend.sort(sortD); A.opvolgen.sort(sortD);
  return A;
}

/* ========== Modals ========== */
const modals = [];
function openModal(titel, { wide = false } = {}) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(titel)}"><div class="mh"><h2>${esc(titel)}</h2><button class="x" aria-label="Sluiten">×</button></div><div class="mb"></div><div class="mf"></div></div>`;
  document.body.appendChild(ov);
  const m = { el: ov, body: $('.mb', ov), foot: $('.mf', ov), close: () => { ov.remove(); const i = modals.indexOf(m); if (i > -1) modals.splice(i, 1); } };
  ov.addEventListener('mousedown', e => { if (e.target === ov) m.close(); });
  $('.x', ov).onclick = m.close;
  modals.push(m);
  return m;
}
const closeAll = () => modals.slice().forEach(m => m.close());
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modals.length) modals[modals.length - 1].close(); });
function vraag(titel, tekst, knop, gevaarlijk = true, typ = '') {
  return new Promise(res => {
    const m = openModal(titel);
    m.body.innerHTML = `<p style="margin:0">${tekst}</p>${typ ? `<label class="f" for="vraagTyp" style="margin-top:12px"><span>Typ ${esc(typ)} om te bevestigen</span><input type="text" id="vraagTyp" autocomplete="off"></label>` : ''}`;
    m.foot.innerHTML = `<button class="btn" data-x>Annuleren</button><button class="btn ${gevaarlijk ? 'danger' : 'pri'}" data-ok>${esc(knop)}</button>`;
    const sluit = v => { m.close(); res(v); };
    $('[data-x]', m.foot).onclick = () => sluit(false);
    $('.x', m.el).onclick = () => sluit(false);
    $('[data-ok]', m.foot).onclick = () => { if (typ && $('#vraagTyp', m.body).value.trim() !== typ) { $('#vraagTyp', m.body).focus(); return; } sluit(true); };
    setTimeout(() => ($('#vraagTyp', m.body) || $('[data-ok]', m.foot)).focus(), 30);
  });
}

function optiesHtml(opts, v) {
  return opts.map(o => o.group ? `<optgroup label="${esc(o.group)}">${optiesHtml(o.items, v)}</optgroup>` : `<option value="${esc(o[0])}" ${String(v ?? '') === String(o[0]) ? 'selected' : ''}>${esc(o[1])}</option>`).join('');
}
function veldHtml(f, v) {
  const id = 'fld_' + f.k; const cls = f.full ? 'full' : '';
  const lab = `<span>${esc(f.l)}${f.req ? ' *' : ''}</span>`;
  if (f.t === 'select') return `<label class="f ${cls}" for="${id}">${lab}<select id="${id}" name="${f.k}">${optiesHtml(f.o, v)}</select></label>`;
  if (f.t === 'textarea') return `<label class="f ${cls}" for="${id}">${lab}<textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea></label>`;
  const list = f.list ? `<datalist id="${id}_l">${f.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : '';
  return `<label class="f ${cls}" for="${id}">${lab}<input type="${f.t || 'text'}" id="${id}" name="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph || '')}" ${f.list ? `list="${id}_l"` : ''} ${f.t === 'number' ? 'step="any" min="0"' : ''}>${list}</label>`;
}
const leesVeld = (el, f) => { const x = el.querySelector(`[name="${f.k}"]`); return x ? (f.t === 'number' ? (x.value === '' ? '' : num(x.value)) : x.value.trim()) : undefined; };

const klantOpts = (leegLabel = 'Geen klant') => [['', leegLabel], ...S.klanten.slice().sort((a, b) => a.naam.localeCompare(b.naam)).map(k => [k.id, k.naam])];
function koppelOpts() {

}

  wisAlles: async () => {
    if (!(await vraag('Dashboardgegevens wissen?', 'Alle leads, klanten, projecten, automatiseringen en taken worden uit het dashboard verwijderd. De dagelijkse kopieën in de map <span class="mono">backups/</span> blijven bestaan.', 'Alles wissen', true, 'WISSEN'))) return;
    S = leeg(); Store.save(); render(); toast('Dashboardgegevens gewist');
  }
};
async function naarBoekhouding(href) { if (Store.pending) await Store.writeNow(); location.href = href; }
document.addEventListener('click', e => {
  const t = e.target;
  const bk = t.closest('a[data-bk]');
  if (bk) { if (Store.pending) { e.preventDefault(); naarBoekhouding(bk.getAttribute('href')); } return; }
  const go = t.closest('[data-go]');
  if (go) { const [a, b] = go.dataset.go.split(':'); closeAll(); if (a === 'nav') location.hash = '#' + b; else if (a === 'bk') naarBoekhouding('boekhouding.html#' + b); else if (a === 'new') bewerk(b, null); return; }
  const op = t.closest('[data-open]');
  if (op && !t.closest('.chk')) { e.preventDefault(); openRef(op.dataset.open); return; }
  const nw = t.closest('[data-new]');
  if (nw) {
    const soort = nw.dataset.new; const preset = {};
    if (nw.dataset.koppel) preset.koppeling = nw.dataset.koppel;
    if (nw.dataset.klant) { if (soort === 'project') preset.klantId = nw.dataset.klant; if (soort === 'automatisering') preset.voor = nw.dataset.klant; }
    if (soort !== 'taak') closeAll();
    bewerk(soort, null, preset); return;
  }
  const ui = t.closest('[data-ui]');
  if (ui) { const [k, v] = ui.dataset.ui.split('='); UI[k] = v; render(); return; }
  const act = t.closest('[data-act]');
  if (act && ACT[act.dataset.act]) ACT[act.dataset.act](act);
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.matches('.chk[data-done]')) {
    const tk = byId(S.taken, el.dataset.done); if (!tk) return;
    tk.klaar = el.checked; tk.klaarOp = el.checked ? Date.now() : null; Store.save();
    if (el.checked) toast('Klaar: ' + tk.titel);
    setTimeout(() => { $$('[data-takenbox]').forEach(b => b.innerHTML = takenLijst(b.dataset.takenbox)); render(); }, 250);
    return;
  }
  if (el.dataset.uisel) { UI[el.dataset.uisel] = el.value; render(); return; }
  if (el.dataset.set) { S.instellingen[el.dataset.set] = el.value.trim(); Store.save(); render(); toast('Opgeslagen', 1200); return; }
  if (el.id === 'restoreFile' && el.files[0]) {
    const f = el.files[0]; el.value = '';
    try { await vraagEnZetTerug(await f.text()); } catch (err) { toast('Terugzetten mislukt: ' + err.message, 4200); }
  }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
// terug in beeld (bijv. na de boekhouding of een ander apparaat): map en cijfers opnieuw lezen
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || modals.length) return;
  const voor = Store.updatedAt;
  if (Store.status === 'connected' && !Store.pending) await Store.loadFromFolder();
  await laadFin(); render();
  if (Store.updatedAt !== voor) toast('Bijgewerkt vanuit de map');
});
window.addEventListener('pageshow', e => { if (e.persisted) laadFin().then(render); });
// bij een nieuwe dag de werklijst opnieuw opbouwen
let _dag = today();
setInterval(() => { if (today() !== _dag) { _dag = today(); render(); } }, 60000);

(async function boot() {
  try { await Store.init(); } catch (e) { console.error(e); Store.status = 'error'; Store.error = e.message; }
  await laadFin();
  render();
})();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker niet geregistreerd', e));
</script>
